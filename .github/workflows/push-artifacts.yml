# Build artifacts and push to S3
name: Publish to S3
on:
  push:
    branches:
      - main
    paths-ignore:
      - scripts/**
      - README.md
      - .github/workflows/**
      - "!.github/workflows/push-artifacts.yml"
  workflow_dispatch:
jobs:
  push-artifacts-to-s3:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Project
        run: pnpm cibuild
      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://${{ vars.AWS_S3_BUCKET }}/rb-website --delete
      - name: Regenerate rolling images
        run: |
          aws lambda invoke \
            --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            lambda-response.json > lambda-invoke.json

          cat lambda-invoke.json
          cat lambda-response.json

          if jq -e '.FunctionError' lambda-invoke.json > /dev/null; then
            echo "Lambda invocation failed:"
            cat lambda-invoke.json
            exit 1
          fi

          if ! jq -e '.statusCode == 200' lambda-response.json > /dev/null; then
            echo "Lambda returned a non-200 status code:"
            cat lambda-response.json
            exit 1
          fi

          if ! jq -e '(.body | fromjson | .success) == true' lambda-response.json > /dev/null; then
            if jq -e '(.body | fromjson | .message) == "No image links found"' lambda-response.json > /dev/null; then
              echo "Lambda did not find image links to refresh; continuing deployment."
            else
              echo "Lambda did not regenerate rolling images successfully:"
              cat lambda-response.json
              exit 1
            fi
          fi
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
