---
name: Check Build

on:
  pull_request:
    branches:
      - main
      - rebuild
  push:
    branches:
      - main
      - rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-build:
    name: Check pnpm build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
